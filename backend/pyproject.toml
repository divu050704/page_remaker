[tool.poetry]
name = "page_remaker"
version = "0.1.0"
description = "Edit your landing pages with AI"
authors = ["Divyanshu Sharma <divyanshu14472@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.0,<6.0"
daphne = "^4.2.1"
djangorestframework = "^3.17.1"
django-cors-headers = "^4.9.0"
beautifulsoup4 = "^4.14.3"
playwright = "^1.58.0"
google-genai = "^1.72.0"
langgraph = "^1.1.6"
playwright-stealth = "^2.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"